[package]
name = "khata-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Khata layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints]
workspace = true

[dependencies]
khata-geom = { workspace = true }
khata-doc = { workspace = true }
khata-fonts = { workspace = true }
khata-proof = { workspace = true }
kurbo = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"
