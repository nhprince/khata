  <title>Khata</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/khata.ico" />
  <link data-trunk rel="rust" data-bin="khata-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #efe6c4; }
    #khata_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* The loading screen is a sheet of dotted notebook paper. */
    #khata_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      color: #1a1a1a; pointer-events: none;
      background-color: #fffbe8; background-image: radial-gradient(#d9cd9a 1.2px, transparent 1.2px); background-size: 24px 24px;
      font: 26px "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; }
    #khata_loading svg { animation: khata-bob 1.4s ease-in-out infinite; }
    @keyframes khata-bob { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { #khata_loading svg { animation: none; } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #17150f; }
      #khata_loading { color: #f5eeda; background-color: #24211a; background-image: radial-gradient(#4a4533 1.2px, transparent 1.2px); }
    }
  </style>
</head>
