# Hosts the browser version of Khata on Cloudflare Pages (a fast CDN, with your own domain), in
# addition to the GitHub Pages demo that the Release workflow deploys.
#
# It runs automatically after every successful release (the Release workflow calls it once the
# release is published), or by hand: Actions > "Web (Cloudflare Pages)" > Run workflow. It does NOT
# run on ordinary pushes.
#
# It does nothing (and does not fail) until the two secrets below exist, so it is safe to keep
# in the repository before Cloudflare is set up. One-time setup: docs/cloudflare-pages.md.
#   CLOUDFLARE_API_TOKEN   token with  Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Optional repository variable CLOUDFLARE_PROJECT: the Pages project name (default: khata).
name: Web (Cloudflare Pages)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (default: the triggering commit)"
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'khata' }}
    steps:
      - name: Check that Cloudflare is configured
        id: cfg
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Pages is not configured yet (secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID); skipping. See docs/cloudflare-pages.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.configured == 'true'
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cfg.outputs.configured == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.cfg.outputs.configured == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.cfg.outputs.configured == 'true'
        with:
          tool: trunk
      - name: Build the web version
        if: steps.cfg.outputs.configured == 'true'
        run: |
          find packaging -name '*.sh' -exec chmod +x {} +
          bash packaging/web/package.sh
      - name: Stage the site (the build plus the Cloudflare header rules)
        if: steps.cfg.outputs.configured == 'true'
        run: |
          mkdir -p dist/cloudflare
          cp -R dist/web/. dist/cloudflare/
          cp packaging/web/_headers dist/cloudflare/_headers
          du -sh dist/cloudflare
          find dist/cloudflare -type f -size +24M -print -exec false {} + || { echo "::error::a file is over Cloudflare Pages' 25 MiB limit"; exit 1; }
      - name: Create the Pages project if it does not exist yet
        if: steps.cfg.outputs.configured == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cfg.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/cloudflare --project-name=${{ env.PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Summary
        if: steps.cfg.outputs.configured == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare Pages"
            echo "Deployed to: ${URL:-see the Cloudflare dashboard}"
            echo "Production address: https://${PROJECT}.pages.dev (plus your custom domain once connected)"
          } >> "$GITHUB_STEP_SUMMARY"
