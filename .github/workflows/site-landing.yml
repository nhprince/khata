# The Khata website (khata.bond): deploys the static site in site/ to Cloudflare Pages on every push to
# main that changes it (or by hand: Actions > "Site (khata.bond)" > Run workflow).
#
# It checks the site first, and does nothing (without failing) until the two secrets exist:
#   CLOUDFLARE_API_TOKEN   token with  Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Optional repository variable CLOUDFLARE_PROJECT: the Pages project name (default: khata).
# Setup, domains and DNS: docs/hosting.md.
name: Site (khata.bond)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packaging/check-site.py"
      - ".github/workflows/site-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'khata' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the site (links, fonts, images, security policy)
        run: python3 packaging/check-site.py
      - name: Check that Cloudflare is configured
        id: cfg
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare is not configured yet (secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID); the site was checked but not deployed. See docs/hosting.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Look for the Pages project
        id: project
        if: steps.cfg.outputs.configured == 'true'
        shell: bash
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages project '$PROJECT' not found (HTTP $code), creating it."
          fi
      - name: Create the Pages project (first run only)
        if: steps.cfg.outputs.configured == 'true' && steps.project.outputs.exists == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cfg.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Smoke test the new deployment
        if: steps.cfg.outputs.configured == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$URL" -o /tmp/home.html
          grep -q "Khata" /tmp/home.html
          echo "The deployment answers and contains the Khata page."
      - name: Summary
        if: steps.cfg.outputs.configured == 'true'
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          # Cloudflare may add a suffix to the project address when the name is taken (khata.pages.dev
          # belongs to someone else), so ask for the real one.
          sub="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])" 2>/dev/null || true)"
          {
            echo "### Website deployed"
            echo "This deployment: ${URL}"
            [ -z "$sub" ] || echo "Your Cloudflare project address: https://${sub}"
            echo "Public address: https://khata.bond (custom domain, see docs/hosting.md)"
          } >> "$GITHUB_STEP_SUMMARY"
