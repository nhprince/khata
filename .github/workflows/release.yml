# Khata release pipeline: ONE action does everything.
#
#   Actions > "Release" > "Run workflow", type the new version (for example 0.2.0). The workflow:
#     1. bumps the version and commits it to the branch,
#     2. builds the installers (Windows, Linux, macOS) and the web app, in parallel,
#     3. publishes the GitHub Release (installers, checksums, license notices, change list; the tag is
#        created at this point, so a failed build leaves nothing half-done and you can simply run it again),
#     4. deploys the web app to app.khata.bond (the very same build that is in the release),
#     5. deploys the website khata.bond (its download buttons are bound to this release).
#   Leave "version" empty for a dry run: everything is built and attached to the run, nothing is
#   published, committed or deployed. A version with a suffix (0.2.0-beta.1) is published as a
#   pre-release and does not touch the live app or website.
#   By hand instead: `cargo xtask version set 0.2.0`, commit, `git tag v0.2.0`, `git push --tags`.
#
# Windows, Linux and the web build are required (a release must exist for every platform, or not at all);
# macOS is best effort. See docs/maintenance.md for the whole picture.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.2.0 or 0.2.0-beta.1 (empty = dry run, publishes nothing)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------------------------
  # Decide the version, bump and tag it when asked to, and tell the other jobs what to build.
  # ---------------------------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
      - name: Work out the version
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          current="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          [ -n "$current" ] || { echo "::error::could not read [workspace.package] version from Cargo.toml"; exit 1; }

          if [ "$EVENT" = "push" ]; then
            # A pushed tag vX.Y.Z: the version in Cargo.toml must already match it.
            version="${REF_NAME#v}"
            [[ "$version" =~ $semver ]] || { echo "::error::tag '$REF_NAME' is not vX.Y.Z"; exit 1; }
            if [ "$version" != "$current" ]; then
              echo "::error::tag $REF_NAME does not match Cargo.toml version $current. Run 'cargo xtask version set $version', commit, and re-tag."
              exit 1
            fi
            publish=true
            ref="$GITHUB_SHA"
          elif [ -n "$INPUT_VERSION" ]; then
            # One-click release: bump and commit (the tag comes with the published release).
            version="${INPUT_VERSION#v}"
            [[ "$version" =~ $semver ]] || { echo "::error::'$INPUT_VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"; exit 1; }
            [ "$REF_TYPE" = "branch" ] || { echo "::error::run this workflow from a branch (usually main), not a tag"; exit 1; }
            [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || { echo "::error::releases are made from $DEFAULT_BRANCH (you started this on $REF_NAME). Use an empty version for a dry run on another branch."; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::tag v$version already exists"; exit 1
            fi
            cargo xtask version set "$version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git diff --cached --quiet || git commit -m "Release v$version"
            # No tag yet: the release job creates it once everything has built.
            if ! git push origin "HEAD:refs/heads/$REF_NAME"; then
              git pull --rebase origin "$REF_NAME"
              git push origin "HEAD:refs/heads/$REF_NAME"
            fi
            publish=true
            ref="$(git rev-parse HEAD)"
          else
            # Dry run: build the current version, publish nothing.
            version="$current"
            publish=false
            ref="$GITHUB_SHA"
          fi

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "ref=$ref"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (publish=$publish, commit $ref)"

  # ---------------------------------------------------------------------------------------------
  # Windows: MSI installer + portable zip (required).
  # ---------------------------------------------------------------------------------------------
  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      KHATA_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Generate THIRD_PARTY_LICENSES.txt (also fails on a disallowed license)
        shell: pwsh
        run: python packaging/third-party-licenses.py
      - name: Package (MSI and portable zip)
        id: pkg
        continue-on-error: true
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Fallback (portable zip only)
        if: steps.pkg.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output "::warning::The MSI build failed; shipping the portable zip only."
          $bin = "target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path "$bin/khata.exe")) { throw "khata.exe was not built" }
          $name = "khata-$env:KHATA_VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force "dist/release/$name" | Out-Null
          Copy-Item "$bin/khata.exe", "$bin/khata-cli.exe", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE" "dist/release/$name"
          Compress-Archive -Path "dist/release/$name" -DestinationPath "dist/release/$name.zip" -Force
          Remove-Item -Recurse -Force "dist/release/$name"
      - name: Add the third-party license notice to the release files
        shell: pwsh
        run: Copy-Item THIRD_PARTY_LICENSES.txt dist/release/
      - name: List what was built
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/release | ForEach-Object { "{0,12:N0} bytes  {1}" -f $_.Length, $_.Name }
          @("### Windows packages", '```') + $files + @('```') | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/release/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Linux: AppImage, .deb, .rpm and .tar.gz (required). Built on Ubuntu 22.04 so it runs on newer distros.
  # ---------------------------------------------------------------------------------------------
  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      KHATA_VERSION: ${{ needs.prepare.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev \
            desktop-file-utils appstream zsync file
      - name: Install nfpm (deb and rpm builder)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generate THIRD_PARTY_LICENSES.txt (also fails on a disallowed license)
        run: python3 packaging/third-party-licenses.py
      - name: Make the packaging scripts executable
        run: find packaging -name '*.sh' -exec chmod +x {} +
      - name: Package (AppImage, deb, rpm, tar.gz)
        id: pkg
        continue-on-error: true
        run: bash packaging/linux/package.sh
      - name: Fallback (deb and tar.gz only)
        if: steps.pkg.outcome == 'failure'
        run: |
          echo "::warning::The full Linux packaging failed; shipping deb and tar.gz only."
          bash packaging/linux/package.sh --skip-build --formats "deb tar"
      - name: List what was built
        shell: bash
        run: |
          { echo "### Linux packages"; echo '```'; ls -lh dist/release; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/release/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # macOS: universal .dmg (best effort; ad-hoc signed unless Apple secrets are added).
  # ---------------------------------------------------------------------------------------------
  macos:
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    env:
      KHATA_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generate THIRD_PARTY_LICENSES.txt (also fails on a disallowed license)
        run: python3 packaging/third-party-licenses.py
      - name: Make the packaging scripts executable
        run: find packaging -name '*.sh' -exec chmod +x {} +
      - name: Package (universal dmg and CLI zip)
        run: bash packaging/macos/package.sh --arch universal
      - name: List what was built
        run: |
          { echo "### macOS packages"; echo '```'; ls -lh dist/release; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Mark the macOS build as good
        id: done
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # Web: the in-browser version. It becomes the zip in the release AND, after the release is published,
  # the live app at app.khata.bond (same build, so the two can never differ).
  # ---------------------------------------------------------------------------------------------
  web:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      KHATA_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Generate THIRD_PARTY_LICENSES.txt (also fails on a disallowed license)
        run: python3 packaging/third-party-licenses.py
      - name: Make the packaging scripts executable
        run: find packaging -name '*.sh' -exec chmod +x {} +
      - name: Build the web version
        run: bash packaging/web/package.sh
      - name: List what was built
        run: |
          { echo "### Web build"; echo '```'; ls -lh dist/release; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/release/*
          if-no-files-found: error
      # The same files go to app.khata.bond after the release is published (the "pages" job below).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  # ---------------------------------------------------------------------------------------------
  # Publish: checksums, an automatic change list from the commit messages, and the GitHub Release.
  # ---------------------------------------------------------------------------------------------
  release:
    needs: [prepare, windows, linux, macos, web]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REF: ${{ needs.prepare.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${REF}^" 2>/dev/null || true)"
          range="${prev:+$prev..}$REF"
          {
            echo "## Downloads"
            echo
            echo "| Platform | Files |"
            echo "|---|---|"
            row() {
              # shellcheck disable=SC2016
              files="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | grep -vi '^SHA256SUMS' | grep -i -- "$2" | sed 's/.*/`&`/' | paste -sd'|' - | sed 's/|/, /g' || true)"
              [ -z "$files" ] || echo "| $1 | $files |"
            }
            row Windows 'windows'
            row macOS 'macos'
            row Linux 'linux'
            row Browser 'web'
            echo
            echo "> These builds are not code-signed yet. Windows SmartScreen may show *Unknown publisher*"
            echo "> (More info, then Run anyway). On macOS 15 or later, open the app once, then go to"
            echo "> System Settings > Privacy & Security and click *Open Anyway*."
            echo "> Open-source license notices: \`THIRD_PARTY_LICENSES.txt\` (also inside the packages)."
            echo "> Verify downloads with \`SHA256SUMS.txt\`."
            echo
            echo "## What's changed"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" | grep -v '^- Release v' || echo "- First release"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Create the release as a draft and upload everything
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: Khata v${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish the release (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          # By the draft's id: GitHub does not list drafts under their tag name, the tag does not exist yet.
          [ -n "$RELEASE_ID" ] || { echo "::error::the draft release id is missing"; exit 1; }
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq '"Published " + .html_url'

  # ---------------------------------------------------------------------------------------------
  # After the release is published: the web app and the website follow it automatically.
  # (Pre-releases such as 0.2.0-beta.1 never touch the live app or website.)
  # ---------------------------------------------------------------------------------------------
  pages:
    needs: [prepare, release]
    concurrency:
      group: pages
      cancel-in-progress: false
    if: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  site:
    needs: [prepare, release]
    if: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false' && needs.release.result == 'success' }}
    uses: ./.github/workflows/site-landing.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      tag: v${{ needs.prepare.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  report:
    needs: [prepare, windows, linux, macos, web, release, pages, site]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      R_WINDOWS: ${{ needs.windows.result }}
      R_LINUX: ${{ needs.linux.result }}
      R_MACOS: "${{ needs.macos.outputs.ok == 'true' && 'success' || 'failed (optional, see the job)' }}"
      R_WEB: ${{ needs.web.result }}
      R_RELEASE: ${{ needs.release.result }}
      R_PAGES: ${{ needs.pages.result }}
      R_SITE: "${{ needs.site.result }}${{ needs.site.outputs.deployed == 'false' && ' (not deployed, the Cloudflare secrets are missing)' || '' }}"
    steps:
      - name: Summary of this release
        run: |
          {
            echo "### Release v$VERSION"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Windows installer | $R_WINDOWS |"
            echo "| Linux packages | $R_LINUX |"
            echo "| macOS disk image (optional) | $R_MACOS |"
            echo "| Web build | $R_WEB |"
            echo "| GitHub Release published | $R_RELEASE |"
            echo "| Web app live at app.khata.bond | $R_PAGES |"
            echo "| Website live at khata.bond | $R_SITE |"
            if [ "$PRERELEASE" = "true" ]; then echo; echo "Pre-release: the live app and website were left alone."; fi
            if [ "$R_RELEASE" != "success" ]; then echo; echo "The release was not published; nothing was tagged. Fix the failing job and run Release again with the same version."; fi
          } >> "$GITHUB_STEP_SUMMARY"
