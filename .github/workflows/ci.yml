# Khata CI: type-check the workspace and run the tests on Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the workspace
        run: cargo check --workspace --all-targets
      - name: Test the document model, engine and interface
        run: cargo test -p khata-doc -p khata-engine -p khata-ui-egui --lib
      - name: Audit dependency licenses (fails on a copyleft or unknown license)
        run: python3 packaging/third-party-licenses.py --check
